      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: auto;

    .container {
      max-width: 1960px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .diagram-frame {
      width: 100%;
      background: #0A0E14;

      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      overflow-x: auto;
    }
    svg {
      width: 100%;
      min-width: 1920px;
      height: auto;
      display: block;
    }
    @media print {
      body { padding: 0; background: #0A0E14; }
